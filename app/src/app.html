<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0d" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyFinance" />
  <title>MyFinance</title>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="tap">
  <!-- Deliberately not display:contents: Android password managers (e.g. NordPass
  included) read the accessibility tree, not the DOM, to find login fields —
  a display:contents ancestor drops its descendants' bounds from that tree
  and the fields become invisible to autofill on Android specifically. -->
  <div>%sveltekit.body%</div>
</body>
</html>
